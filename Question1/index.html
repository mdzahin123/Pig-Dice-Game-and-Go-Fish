<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pig Dice Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      height: 100vh;
      color: #333;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
      color: #4e4e4e;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
    }

    #scoreboard {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      margin-right: 20px;
      text-align: left;
      font-size: 18px;
    }

    #scoreboard h2 {
      color: #ff6f61;
    }

    button {
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      transition: transform 0.2s, background 0.2s;
    }

    button:hover {
      transform: scale(1.1);
      background: linear-gradient(135deg, #2575fc, #6a11cb);
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    #game-controls {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    #game-status {
      margin-top: 20px;
      font-size: 18px;
      color: #2b2b2b;
      font-weight: bold;
    }

    .container {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: flex-start;
      gap: 20px;
    }

    .game-box {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      min-width: 300px;
    }
  </style>
</head>
<body>
<div class="container">
  <div id="scoreboard">
    <h2>Scoreboard</h2>
    <p>Human: <span id="human-score">0</span></p>
    <p>CPU: <span id="cpu-score">0</span></p>
  </div>

  <div class="game-box">
    <h1>Pig Dice Game</h1>
    <div id="game-controls">
      <button id="roll-btn">Roll Dice</button>
      <button id="hold-btn">Hold</button>
    </div>
    <div id="game-status">Game started! Your turn.</div>
  </div>
</div>

<script>
  // Pig Dice Game Implementation

  // Utility function to roll a die (1-6)
  function rollDie() {
    return Math.floor(Math.random() * 6) + 1;
  }

  // Game variables
  const WINNING_SCORE = 100;
  let humanScore = 0;
  let cpuScore = 0;
  let humanTurnScore = 0;
  let isHumanTurn = true;
  const gameStatus = document.getElementById("game-status");
  const rollBtn = document.getElementById("roll-btn");
  const holdBtn = document.getElementById("hold-btn");
  const humanScoreDisplay = document.getElementById("human-score");
  const cpuScoreDisplay = document.getElementById("cpu-score");

  function updateStatus(message) {
    gameStatus.innerHTML = message;
  }

  function updateScores() {
    humanScoreDisplay.textContent = humanScore;
    cpuScoreDisplay.textContent = cpuScore;
  }

  function cpuTurn() {
    let cpuTurnScore = 0;
    updateStatus("CPU's turn...");

    const cpuInterval = setInterval(() => {
      const roll = rollDie();
      if (roll === 1) {
        updateStatus("CPU rolled a 1. Turn forfeited, no points added.");
        clearInterval(cpuInterval);
        isHumanTurn = true;
        return;
      }

      cpuTurnScore += roll;
      updateStatus(`CPU rolled: ${roll}. CPU turn score: ${cpuTurnScore}`);

      // CPU randomly decides to roll again or hold
      if (Math.random() < 0.5 || cpuTurnScore + cpuScore >= WINNING_SCORE) {
        cpuScore += cpuTurnScore;
        updateScores();
        updateStatus(`CPU holds. CPU total score: ${cpuScore}`);
        clearInterval(cpuInterval);
        isHumanTurn = true;
      }

      if (cpuScore >= WINNING_SCORE) {
        updateStatus("CPU won the game! Better luck next time.");
        clearInterval(cpuInterval);
        rollBtn.disabled = true;
        holdBtn.disabled = true;
      }
    }, 1000);
  }

  rollBtn.addEventListener("click", () => {
    if (!isHumanTurn) return;
    const roll = rollDie();

    if (roll === 1) {
      updateStatus("You rolled a 1! Turn forfeited, no points added.");
      humanTurnScore = 0;
      isHumanTurn = false;
      setTimeout(cpuTurn, 1000);
    } else {
      humanTurnScore += roll;
      updateStatus(`You rolled: ${roll}. Current turn score: ${humanTurnScore}`);
    }
  });

  holdBtn.addEventListener("click", () => {
    if (!isHumanTurn) return;
    humanScore += humanTurnScore;
    humanTurnScore = 0;
    updateScores();

    updateStatus(`You hold. Your total score: ${humanScore}`);

    if (humanScore >= WINNING_SCORE) {
      updateStatus("Congratulations! You won the game!");
      rollBtn.disabled = true;
      holdBtn.disabled = true;
    } else {
      isHumanTurn = false;
      setTimeout(cpuTurn, 1000);
    }
  });

  updateStatus("Game started! Your turn.");
</script>
</body>
</html>
